# pnpm workspace: the reusable Box engine as apps/ + packages/. Workspace deps are `workspace:*`
# and SYMLINKED (linkWorkspacePackages) - combined with each package's `@silkweave/box-source` export
# condition, apps resolve @silkweave/box-core to its TS source (packages/core/src) in dev, with no build step.
# Packages build to build/ via tsdown only on prepack/CI (never in dev). Turbo orchestrates the graph.
packages:
  - apps/*
  - packages/*
linkWorkspacePackages: true

# Approved postinstall build scripts (native/compile steps) + supply-chain release-age exceptions,
# carried over from the single-package layout.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  '@swc/core': true
  '@nestjs/core': false
  '@scarf/scarf': false
# @silkweave/* and @workerdeck/* are first-party (we publish them from the silkweave and
# workerdeck repos), so the release-age quarantine adds nothing there - exempt the whole scope
# instead of pinning each release. (@workerdeck/* was @claude-worker/* until the 0.17 rename.)
minimumReleaseAgeExclude:
  - '@silkweave/*'
  - '@workerdeck/*'
