name: box_mobile
description: >-
  The Silkweave Box mobile framework - app shell, module contract, session,
  API client, theme and UI kit. Feature modules and the app depend on it.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

# The framework owns the dependencies every module shares. A feature module
# declares only what it adds on top (see docs/MOBILE.md, "Dependencies").
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  shared_preferences: ^2.5.5
  google_fonts: ^6.3.3
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.17
  liquid_glass_widgets: ^1.2.2
  flutter_local_notifications: ^19.5.0
  url_launcher: ^6.3.2
  # For lib/testing.dart, the module test helpers (fake server, test session).
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
